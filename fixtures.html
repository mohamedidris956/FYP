<script>
async function loadNextFixture() {
  try {
    const response = await fetch('http://localhost:5001/api/fixtures');
    const fixtures = await response.json();

    if (!fixtures.length) return;

    // sort by date (ascending)
    fixtures.sort((a, b) => new Date(a.date) - new Date(b.date));

    const nextGame = fixtures[0]; 

    // update UI values
    document.getElementById('next-opponent').innerText = `IPY FC vs ${nextGame.opponent}`;
    document.getElementById('next-date').innerText = new Date(nextGame.date).toLocaleDateString();
    document.getElementById('next-venue').innerText = nextGame.venue;
  } catch (error) {
    console.error("Error loading next fixture:", error);
  }
}

loadNextFixture();
</script>



<script>
  async function loadLeague() {
    try {
      const res = await fetch("http://localhost:5001/api/league");
      const table = await res.json();

      const tbody = document.getElementById("leagueTableBody");
      tbody.innerHTML = "";

      table.sort((a, b) => b.pts - a.pts);

      table.forEach((team, index) => {
        tbody.innerHTML += `
          <tr>
            <td>${index + 1}</td>
            <td>${team.team}</td>
            <td>${team.mp}</td>
            <td>${team.w}</td>
            <td>${team.d}</td>
            <td>${team.l}</td>
            <td><strong>${team.pts}</strong></td>
          </tr>
        `;
      });
    } catch (err) {
      console.error("Error loading league:", err);
    }
  }

  loadLeague();
</script>
<script>
const token = localStorage.getItem("token");
const userName = localStorage.getItem("userName");

const signInBtn = document.getElementById("signinDropdown");
const userDisplay = document.getElementById("userDisplay");
const logoutBtn = document.getElementById("logoutBtn");

// Only update if elements exist
if (token && userName) {
  if (signInBtn) signInBtn.style.display = "none";
  if (userDisplay) userDisplay.textContent = `Welcome, ${userName}`;
  if (logoutBtn) logoutBtn.style.display = "inline-block";
} else {
  if (logoutBtn) logoutBtn.style.display = "none";
  if (userDisplay) userDisplay.textContent = "";
}

// Logout function
function logoutUser() {
  localStorage.removeItem("token");
  localStorage.removeItem("userName");
  localStorage.removeItem("userRole");
  window.location.reload();
}
</script>
