<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | IPY FC</title>

  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>
<body>
   <header id="header" class="header d-flex align-items-center sticky-top">
  <div class="container-fluid d-flex align-items-center justify-content-between">

    <!-- Logo -->
    <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
      <img src="assets/img/IPYlogo.jpg" alt="IPY FC Logo" class="img-fluid" style="height: 130px;">
    </a>

    <!-- Navbar -->
    <nav id="navmenu" class="navmenu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="fixtures.html">Fixtures</a></li>
        <li><a href="media.html">Media</a></li>
        <li><a href="team.html">Team</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="fanhub.html">Fan Hub</a></li>
      </ul>
      <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
    </nav>

    <!-- Auth Area -->
    <div id="authArea"></div>

  </div>
</header>


  <div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="card p-4 shadow" style="max-width:400px; width:100%;">
      <h3 class="text-center mb-3">Create Account</h3>

      <form id="registerForm">
        <div class="mb-3">
          <label>Username</label>
          <input type="text" class="form-control" id="regName" required>
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" id="regEmail" required>
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input type="password" class="form-control" id="regPassword" required>
        </div>

        <div class="mb-3">
          <label>Re-enter Password</label>
          <input type="password" class="form-control" id="regPassword2" required>
        </div>

        <button type="submit" class="btn btn-success w-100">Create Account</button>
      </form>

      <p class="text-center mt-3">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/register.js"></script>
</body>
</html>
