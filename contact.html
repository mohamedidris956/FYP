<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>

  <!-- Header -->
<header id="header" class="header d-flex align-items-center sticky-top">
  <div class="container d-flex align-items-center justify-content-between">

    <!-- Logo -->
    <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
      <img src="assets/img/IPYlogo.jpg" alt="IPY FC Logo" class="img-fluid" style="height: 130px;">
    </a>

    <!-- Navbar -->
    <nav id="navmenu" class="navmenu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="fixtures.html">Fixtures</a></li>
        <li><a href="media.html">Media</a></li>
        <li><a href="team.html">Team</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="fanhub.html">Fan Hub</a></li>
      </ul>
      <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
    </nav>

    <!-- Auth Display (Sign In OR Welcome + Logout) -->
    <div id="authArea" class="d-flex align-items-center"></div>

  </div>
</header>


  <main class="main">

    <!-- Contact Hero -->
    <section class="py-5 text-center bg-light">
      <div class="container">
        <h1 data-aos="fade-down">Contact IPY FC</h1>
        <p class="lead" data-aos="fade-up">Get in touch with the club for queries, fixtures, and collaboration.</p>
      </div>
    </section>

    <!-- Contact Info + Form -->
    <section class="py-5">
      <div class="container">
        <div class="row g-4">

          <!-- Contact Info -->
          <div class="col-lg-5" data-aos="fade-right">
            <h3 class="fw-bold mb-4">Club Contact Details</h3>

            <p><i class="bi bi-envelope-fill text-success"></i> <strong>Email:</strong> ipyfc@gmail.com</p>
            <p><i class="bi bi-geo-alt-fill text-success"></i> <strong>Location:</strong> Dublin, Ireland</p>

            <div class="mt-4">
              <h5>Follow Us</h5>
              <a href="#" class="me-3 text-success"><i class="bi bi-facebook fs-3"></i></a>
              <a href="#" class="me-3 text-success"><i class="bi bi-instagram fs-3"></i></a>
              <a href="#" class="text-success"><i class="bi bi-youtube fs-3"></i></a>
            </div>
          </div>

          <!-- Contact Form -->
          <div class="col-lg-7" data-aos="fade-left">
            <form class="bg-light p-4 rounded shadow">
              <h3 class="fw-bold mb-4">Send a Message</h3>

              <div class="mb-3">
                <label class="form-label">Your Name</label>
                <input type="text" class="form-control" placeholder="Enter your name">
              </div>

              <div class="mb-3">
                <label class="form-label">Your Email</label>
                <input type="email" class="form-control" placeholder="Enter your email">
              </div>

              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" placeholder="Write your message here"></textarea>
              </div>

              <button type="submit" class="btn btn-success w-100">Send Message</button>
            </form>
          </div>

        </div>
      </div>
    </section>

  </main>

  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
  </a>

  <!-- JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/js/main.js"></script>
<!-- Auth UI Script -->
<script src="assets/js/authNav.js"></script>
</body>
</html>

<script>
const token = localStorage.getItem("token");
const userName = localStorage.getItem("userName");

const signInBtn = document.getElementById("signinDropdown");
const userDisplay = document.getElementById("userDisplay");
const logoutBtn = document.getElementById("logoutBtn");

// Only update if elements exist
if (token && userName) {
  if (signInBtn) signInBtn.style.display = "none";
  if (userDisplay) userDisplay.textContent = `Welcome, ${userName}`;
  if (logoutBtn) logoutBtn.style.display = "inline-block";
} else {
  if (logoutBtn) logoutBtn.style.display = "none";
  if (userDisplay) userDisplay.textContent = "";
}

// Logout function
function logoutUser() {
  localStorage.removeItem("token");
  localStorage.removeItem("userName");
  localStorage.removeItem("userRole");
  window.location.reload();
}
</script>


</body>
</html>
