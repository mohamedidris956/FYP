<!DOCTYPE html>

  <link href="assets/vendor/aos/aos.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>

  <!-- Header -->
  <header id="header" class="header d-flex align-items-center sticky-top">
    <div class="container d-flex align-items-center justify-content-between">

      <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
        <img src="assets/img/IPYlogo.jpg" alt="IPY FC Logo" style="height:130px;">
      </a>

      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="fixtures.html">Fixtures</a></li>
          <li><a href="media.html" class="active">Media</a></li>
          <li><a href="team.html">Team</a></li>
          <li><a href="news.html">News</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

      <div class="dropdown">
        <a class="btn-getstarted dropdown-toggle" href="#" data-bs-toggle="dropdown">
          Sign In
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="login.html">Login</a></li>
          <li><a class="dropdown-item" href="register.html">Create Account</a></li>
        </ul>
      </div>

    </div>
  </header>

  <main class="main">

    <!-- Media Hero Section -->
    <section class="py-5 text-center bg-light">
      <div class="container">
        <h1 data-aos="fade-down">Media Gallery</h1>
        <p class="lead" data-aos="fade-up">Photos and Video Highlights from IPY FC Matches & Events</p>
      </div>
    </section>

    <!-- Photo Gallery -->
    <section class="py-5">
      <div class="container">
        <h2 class="text-center mb-4">Photo Highlights</h2>
        <div class="row g-4">

          <!-- Photo 1 -->
          <div class="col-md-4" data-aos="zoom-in">
            <img src="assets/img/media1.jpg" class="img-fluid rounded shadow" alt="Media Photo">
          </div>

          <!-- Photo 2 -->
          <div class="col-md-4" data-aos="zoom-in" data-aos-delay="100">
            <img src="assets/img/media2.jpg" class="img-fluid rounded shadow" alt="Media Photo">
          </div>

          <!-- Photo 3 -->
          <div class="col-md-4" data-aos="zoom-in" data-aos-delay="200">
            <img src="assets/img/media3.jpg" class="img-fluid rounded shadow" alt="Media Photo">
          </div>

        </div>
      </div>
    </section>

    <!-- Video Highlights -->
    <section class="py-5 bg-light">
      <div class="container">
        <h2 class="text-center mb-4">Video Highlights</h2>

        <div class="row g-4">

          <!-- Video 1 -->
          <div class="col-md-6" data-aos="fade-right">
            <div class="ratio ratio-16x9 rounded shadow">
              <iframe src="https://www.youtube.com/embed/VIDEO_ID"
                      title="YouTube video player" allowfullscreen></iframe>
            </div>
            <p class="mt-2 text-center fw-bold">Match Highlights - Coming Soon</p>
          </div>

          <!-- Video 2 -->
          <div class="col-md-6" data-aos="fade-left">
            <div class="ratio ratio-16x9 rounded shadow">
              <iframe src="https://www.youtube.com/embed/VIDEO_ID"
                      title="YouTube video player" allowfullscreen></iframe>
            </div>
            <p class="mt-2 text-center fw-bold">Player Interviews - Coming Soon</p>
          </div>

        </div>
      </div>
    </section>

  </main>

  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
  </a>

  <!-- JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/js/main.js"></script>
