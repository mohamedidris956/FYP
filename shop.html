<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Shop | IPY FC</title>

  <link href="assets/img/IPYlogo.jpg" rel="icon">
  <link href="assets/img/IPYlogo.jpg" rel="apple-touch-icon">

  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>

  <header id="header" class="header d-flex align-items-center sticky-top">
  <div class="container d-flex align-items-center justify-content-between">

    <!-- Logo -->
    <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
      <img src="assets/img/IPYlogo.jpg" alt="IPY FC Logo" class="img-fluid" style="height: 130px;">
    </a>

    <!-- Navbar -->
    <nav id="navmenu" class="navmenu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" class="active">Shop</a></li>
        <li><a href="fixtures.html">Fixtures</a></li>
        <li><a href="media.html">Media</a></li>
        <li><a href="team.html">Team</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="fanhub.html">Fan Hub</a></li>
      </ul>
      <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
    </nav>

    <!-- Auth Display -->
    <div id="authArea" class="d-flex align-items-center"></div>

  </div>
</header>

<section class="py-5">
  <div class="container">
    <h2 class="text-center mb-5">Official IPY FC Merchandise</h2>

    <div class="row g-4" id="shopItems">
      <!-- Products are rendered dynamically by assets/js/shop.js -->
    </div>
  </div>
</section>
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="modalTitle" class="modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <img id="modalImage" class="img-fluid mb-3" style="max-height:300px;">
        <p id="modalDescription"></p>
        <p class="fw-bold text-success" id="modalPrice"></p>

        <button class="btn btn-success" id="addToCartBtn">Add to Cart</button>
      </div>
    </div>
  </div>
</div>


  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
  </a>

   <!-- JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/authNav.js"></script>
  <script src="assets/js/shop.js"></script>
  <script src="assets/js/cart.js"></script>

</body>
</html>
