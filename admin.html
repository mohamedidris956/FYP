<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | IPY FC</title>
  <link href="assets/img/IPYlogo.jpg" rel="icon" />
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
  <link href="assets/css/main.css" rel="stylesheet" />
</head>
<body>
  <header id="header" class="header d-flex align-items-center sticky-top">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
        <img src="assets/img/IPYlogo.jpg" alt="IPY FC Logo" class="img-fluid" style="height: 100px;" />
      </a>

      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="admin.html" class="active">Shop Admin</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

      <div id="authArea" class="d-flex align-items-center"></div>
    </div>
  </header>

  <main class="container py-5">
    <h1 class="mb-4">Admin Dashboard - Shop Products</h1>

    <form id="productForm" class="card card-body mb-4">
      <input type="hidden" id="productId" />
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Name</label>
          <input id="name" class="form-control" required />
        </div>
        <div class="col-md-3">
          <label class="form-label">Price</label>
          <input id="price" type="number" min="0" step="0.01" class="form-control" required />
        </div>
        <div class="col-md-3">
          <label class="form-label">Image URL</label>
          <input id="img" class="form-control" required />
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea id="desc" class="form-control" rows="2"></textarea>
        </div>
        <div class="col-12 form-check">
          <input class="form-check-input" type="checkbox" id="isActive" checked />
          <label class="form-check-label" for="isActive">Active</label>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-success" type="submit">Save Product</button>
        <button class="btn btn-secondary" type="button" id="resetBtn">Reset</button>
      </div>
    </form>

    <div class="card card-body">
      <h3 class="mb-3">All Products</h3>
      <div class="table-responsive">
        <table class="table table-striped" id="productsTable">
          <thead>
            <tr>
              <th>Name</th><th>Price</th><th>Active</th><th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/authNav.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
