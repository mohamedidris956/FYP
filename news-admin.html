<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>News Admin | IPY FC</title>

  <link href="assets/img/IPYlogo.jpg" rel="icon">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>
<body>
  <header id="header" class="header d-flex align-items-center sticky-top">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
        <img src="assets/img/IPYlogo.jpg" alt="IPY FC Logo" class="img-fluid" style="height: 100px;">
      </a>

      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="news.html">News</a></li>
          <li><a href="news-admin.html" class="active">News Admin</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

      <div id="authArea" class="d-flex align-items-center"></div>
    </div>
  </header>

  <main class="container py-5 news-admin-wrap">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="mb-0">News Admin</h1>
      <div class="d-flex align-items-center gap-2">
        <span class="badge text-bg-dark">Admin only</span>
        <a href="news.html" class="btn btn-outline-secondary btn-sm">View Public News</a>
      </div>
    </div>

    <p class="text-muted mb-4">Create, edit, and delete news posts.</p>

    <div id="newsAdminError" class="alert alert-danger d-none" role="alert"></div>
    <div id="newsAdminSuccess" class="alert alert-success d-none" role="alert"></div>

    <form id="newsForm" class="card card-body mb-4">
      <input type="hidden" id="newsId" />

      <div class="row g-3">
        <div class="col-12">
          <label class="form-label" for="newsTitle">Title</label>
          <input
            id="newsTitle"
            class="form-control"
            maxlength="160"
            autocomplete="off"
            required
          />
        </div>

        <div class="col-12">
          <label class="form-label" for="newsSummary">Summary</label>
         <!-- news-admin.html -->
        <textarea
        id="newsSummary"
        class="form-control"
        rows="2"
        maxlength="220"
        required
        ></textarea>
        </div>

        <div class="col-12">
          <label class="form-label" for="newsContent">Content</label>
          <textarea
            id="newsContent"
            class="form-control"
            rows="6"
            maxlength="10000"
            required
          ></textarea>
        </div>

        <div class="col-md-6">
          <label class="form-label" for="newsImageUrl">Image URL (optional)</label>
          <input
        id="newsImageUrl"
        type="text"
        class="form-control"
        placeholder="https://... or assets/img/news/your-image.jpg"
         autocomplete="off"
        />
        </div>

        <div class="col-md-6">
          <label class="form-label" for="newsPublishedAt">Published At (optional)</label>
          <input
            id="newsPublishedAt"
            type="datetime-local"
            class="form-control"
          />
        </div>
      </div>

      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-success" type="submit">Save Post</button>
        <button class="btn btn-secondary" type="button" id="newsResetBtn">Reset</button>
      </div>
    </form>

    <div class="card card-body">
      <h3 class="mb-3">All News Posts</h3>

      <div class="table-responsive">
        <table class="table table-striped align-middle" id="newsTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Published</th>
              <th style="width: 170px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Filled by assets/js/newsAdmin.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/authNav.js"></script>
  <script src="assets/js/newsAdmin.js"></script>
</body>
</html>
