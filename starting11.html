<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Build Your Starting XI | IPY FC</title>

  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>

<header id="header" class="header d-flex align-items-center sticky-top">
  <div class="container d-flex align-items-center justify-content-between">

    <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
      <img src="assets/img/IPYlogo.jpg" style="height:130px;">
    </a>


    <!-- Navbar -->
    <nav id="navmenu" class="navmenu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="fixtures.html">Fixtures</a></li>
        <li><a href="media.html">Media</a></li>
        <li><a href="team.html">Team</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="fanhub.html">Fan Hub</a></li>
      </ul>
      <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
    </nav>

    <!-- Auth Display (Sign In OR Welcome + Logout) -->
    <div id="authArea" class="d-flex align-items-center"></div>

  </div>
</header>


<main class="main">

  <section class="py-5 text-center bg-light">
    <div class="container">
      <h1>Build Your Starting XI</h1>
      <p class="lead">Drag players onto the pitch and choose your formation.</p>
    </div>
  </section>

  <section class="py-5">
  <div class="container">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
      <div>
        <h2 class="mb-1">Pick Your Formation</h2>
        <p class="text-muted mb-0">Choose a formation and build your XI.</p>
      </div>

      <div style="min-width:220px;">
        <select id="formationSelect" class="form-select">
          <option value="4-3-3" selected>4-3-3</option>
          <option value="4-4-2">4-4-2</option>
          <option value="3-5-2">3-5-2</option>
        </select>
      </div>
    </div>

    <div class="row g-4">
      <!-- Pitch -->
      <div class="col-lg-8">
        <div class="pitch p-3 p-md-4">
          <div class="pitch-inner">

            <!-- FORWARDS -->
            <div class="pitch-row" id="row-fw"></div>

            <!-- MIDFIELD -->
            <div class="pitch-row" id="row-mf"></div>

            <!-- DEFENCE -->
            <div class="pitch-row" id="row-df"></div>

            <!-- GOALKEEPER -->
            <div class="pitch-row" id="row-gk"></div>

          </div>
        </div>
      </div>

      <!-- Player Pool -->
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="mb-3">Available Players</h4>
            <div id="playerPool" class="player-pool"></div>
          </div>
        </div>

<button id="submitXI" class="btn btn-success w-100 mt-3" disabled>
  <span class="btn-label">Submit Starting XI</span>
</button>

<div id="xiStatus" class="alert d-none mt-3 mb-2" role="alert"></div>

<div class="d-grid gap-2 mt-2">
  <button id="viewSavedTeamsBtn" class="btn btn-outline-secondary d-none" type="button">
    <i class="bi bi-list-check me-1"></i> View Saved Teams
  </button>
  <button id="buildNewTeamBtn" class="btn btn-outline-success d-none" type="button">
    <i class="bi bi-arrow-clockwise me-1"></i> Build New XI
  </button>
</div>

<div id="savedTeamsWrap" class="card shadow-sm mt-3 d-none">
  <div class="card-body">
    <h5 class="mb-3">My Saved Teams</h5>
    <div class="table-responsive">
      <table class="table table-sm align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th>Formation</th>
            <th>Players</th>
            <th>Saved At</th>
          </tr>
        </thead>
        <tbody id="savedTeamsBody"></tbody>
      </table>
    </div>
  </div>
</div>
      </div>
    </div>
  </div>
</section>


</main>

<script src="assets/js/authNav.js"></script>
<script src="assets/js/starting11.js"></script>

</body>
</html>
